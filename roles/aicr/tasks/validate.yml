---
# AICR's own validation: a snapshot agent Job captures the cluster, then the
# recipe's checks run as Jobs in aicr-validation and are cleaned up. The report
# is kept next to the bundle.

- name: Wait for the GPU Operator's operands (the driver is built on each GPU node)
  ansible.builtin.command:
    argv:
      - "{{ aicr_kubectl }}"
      - wait
      - clusterpolicies.nvidia.com/cluster-policy
      - --for=jsonpath={.status.state}=ready
      - --timeout={{ aicr_gpu_operator_timeout_minutes }}m
  environment:
    KUBECONFIG: "{{ aicr_kubeconfig }}"
  changed_when: false
  when: "'gpu-operator' in aicr_bundle_components"

# AICR writes a submission only into an absent or empty directory.
- name: Empty the CNCF evidence directory
  ansible.builtin.file:
    path: "{{ aicr_workdir }}/evidence"
    state: absent
  changed_when: false
  when: aicr_cncf_submission

- name: Run the recipe's checks
  ansible.builtin.command:
    argv: >-
      {{ [aicr_bin_dir ~ '/aicr', 'validate', '--config', aicr_render_dir ~ '/aicr-config.yaml',
          '--kubeconfig', aicr_kubeconfig, '--output', aicr_workdir ~ '/validation.yaml']
         + aicr_data_args }}
  register: aicr_validate_result
  changed_when: false
  # A submission run deploys GPU workloads and an HPA test: about 15 minutes more.
  timeout: "{{ 3600 if aicr_cncf_submission else omit }}"

- name: Where the CNCF submission is
  ansible.builtin.debug:
    msg: "CNCF AI Conformance submission: {{ aicr_workdir }}/evidence on {{ inventory_hostname }}"
  when: aicr_cncf_submission
