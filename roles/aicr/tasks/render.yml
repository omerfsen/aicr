---
# The recipe and the bundle are rendered into an empty directory on every run
# (AICR renders the same inputs to the same bytes), and the new bundle replaces
# the kept one only when they differ.

- name: Work directory
  ansible.builtin.file:
    path: "{{ aicr_workdir }}"
    state: directory
    owner: "{{ aicr_owner }}"
    group: "{{ aicr_group }}"
    mode: "0700"

# Rendering changes nothing on the cluster, so it also runs in check mode.
- name: Empty the render directory
  ansible.builtin.file:
    path: "{{ aicr_render_dir }}"
    state: absent
  changed_when: false
  check_mode: false

- name: Render directory
  ansible.builtin.file:
    path: "{{ aicr_render_dir }}"
    state: directory
    owner: "{{ aicr_owner }}"
    group: "{{ aicr_group }}"
    mode: "0700"
  changed_when: false
  check_mode: false

- name: Write the AICRConfig
  ansible.builtin.template:
    src: aicr-config.yaml.j2
    dest: "{{ aicr_render_dir }}/aicr-config.yaml"
    owner: "{{ aicr_owner }}"
    group: "{{ aicr_group }}"
    mode: "0600"
  changed_when: false
  check_mode: false

# The recipe without the mixins reads only aicr_data_src; everything after it
# reads the data with the mixin overlay too.
- name: The external data flags
  ansible.builtin.set_fact:
    aicr_data_args_plain: "{{ ['--data', aicr_render_dir ~ '/data'] if aicr_data_src | length > 0 else [] }}"
    aicr_data_args: >-
      {{ ['--data', aicr_render_dir ~ '/data']
         if aicr_data_src | length > 0 or aicr_mixins | length > 0 else [] }}

# Inside the render directory: what it changes shows up as a bundle difference.
- name: Copy the external data
  ansible.builtin.copy:
    src: "{{ aicr_data_src | regex_replace('/*$', '') }}/"
    dest: "{{ aicr_render_dir }}/data/"
    owner: "{{ aicr_owner }}"
    group: "{{ aicr_group }}"
    mode: "0600"
    directory_mode: "0700"
  changed_when: false
  check_mode: false
  when: aicr_data_src | length > 0

- name: Render the recipe
  ansible.builtin.command:
    argv: "{{ [aicr_bin_dir ~ '/aicr', 'recipe', '--config', aicr_render_dir ~ '/aicr-config.yaml'] + aicr_data_args_plain }}"
  changed_when: false
  check_mode: false

- name: Compose the opt-in mixins
  ansible.builtin.include_tasks: mixins.yml
  when: aicr_mixins | length > 0

# Fails on an external registry or overlay AICR would not accept, before
# anything is bundled.
- name: Check the external data
  ansible.builtin.command:
    argv: "{{ [aicr_bin_dir ~ '/aicr', 'recipe', 'validate'] + aicr_data_args }}"
  changed_when: false
  check_mode: false
  when: aicr_data_args | length > 0

- name: Summarize the recipe
  ansible.builtin.command:
    argv: [
      "{{ aicr_bin_dir }}/aicr", query, --summary, --format, table,
      --recipe, "{{ aicr_render_dir }}/recipe.yaml"]
  register: aicr_recipe_summary
  changed_when: false
  check_mode: false

# Overlays, constraints, component versions and checks, readable at a glance.
- name: Keep the recipe summary
  ansible.builtin.copy:
    content: "{{ aicr_recipe_summary.stdout }}\n"
    dest: "{{ aicr_workdir }}/recipe-summary.txt"
    owner: "{{ aicr_owner }}"
    group: "{{ aicr_group }}"
    mode: "0600"

# --set-json pairs: ['--set-json', 'component:path=<json>', ...].
- name: Render the bundle
  ansible.builtin.command:
    argv: >-
      {{ [aicr_bin_dir ~ '/aicr', 'bundle', '--config', aicr_render_dir ~ '/aicr-config.yaml']
         + aicr_data_args
         + (['--set-json'] | product(aicr_set_json | dict2items
              | map(attribute='key')
              | zip(aicr_set_json | dict2items | map(attribute='value') | map('to_json'))
              | map('join', '=')) | flatten(levels=1)) }}
  changed_when: false
  check_mode: false

- name: Compare the new bundle with the kept one
  ansible.builtin.command:
    argv: [diff, -r, -q, "{{ aicr_render_dir }}/bundle", "{{ aicr_bundle_dir }}"]
  register: aicr_bundle_diff
  # Check mode skips the swap below, so the difference is reported here.
  changed_when: ansible_check_mode and aicr_bundle_diff.rc != 0
  check_mode: false
  failed_when: aicr_bundle_diff.rc > 2

# The bundle the cluster runs: with helmfile the last one applied in full
# (<workdir>/applied, kept after a successful apply, so a failed apply is
# checked again on the rerun); with argocd-helm the one in the GitOps
# directory, which Argo CD syncs. Before either exists, the last one rendered.
- name: Find the bundle the cluster runs
  ansible.builtin.stat:
    path: >-
      {{ (aicr_gitops_dir | expanduser if aicr_deployer == 'argocd-helm' else aicr_applied_dir)
         ~ '/bundle-info.yaml' }}
  register: aicr_running_stat
  when: aicr_deployer == 'helmfile' or aicr_gitops_dir | length > 0

- name: Remember where it is
  ansible.builtin.set_fact:
    aicr_running_dir: >-
      {{ aicr_running_stat.stat.path | dirname
         if aicr_running_stat.stat.exists | default(false) else aicr_bundle_dir }}

- name: Compare the new bundle with the one the cluster runs
  ansible.builtin.command:
    argv:
      - diff
      - -r
      - -q
      - "{{ aicr_render_dir }}/bundle"
      - "{{ aicr_running_dir }}"
  register: aicr_running_diff
  changed_when: false
  check_mode: false
  failed_when: aicr_running_diff.rc > 2

# Only when that bundle exists and differs (diff exit code 1): AICR's
# transition records say per component whether the move is safe, needs manual
# steps, or was never assessed.
- name: Check the upgrade from the bundle the cluster runs
  ansible.builtin.command:
    argv:
      - "{{ aicr_bin_dir }}/aicr"
      - upgrade-check
      - --from
      - "{{ aicr_running_dir }}"
      - --to
      - "{{ aicr_render_dir }}/bundle"
      - --deployer
      - "{{ aicr_deployer }}"
      - --fail-on-error=false
  register: aicr_upgrade_check_result
  changed_when: false
  check_mode: false
  when: aicr_upgrade_check_mode != 'off' and aicr_running_diff.rc == 1

- name: Upgrade check
  when: aicr_upgrade_check_result.stdout is defined
  block:
    - name: Keep the upgrade check report
      ansible.builtin.copy:
        content: "{{ aicr_upgrade_check_result.stdout }}\n"
        dest: "{{ aicr_workdir }}/upgrade-check.txt"
        owner: "{{ aicr_owner }}"
        group: "{{ aicr_group }}"
        mode: "0600"

    - name: Show the upgrade check
      ansible.builtin.debug:
        msg: "{{ aicr_upgrade_check_result.stdout_lines }}"

    # The verdict column of the table: safe, manual, unsafe, unknown, or "-"
    # for a new or removed component.
    - name: Every change is safe, or the check only reports
      ansible.builtin.assert:
        that: >-
          aicr_upgrade_check_mode == 'report'
          or aicr_upgrade_check_result.stdout_lines
             | select('match', '^\\S+\\s+\\S+\\s+\\S+\\s+(manual|unsafe|unknown)(\\s|$)')
             | list | length == 0
        fail_msg: >-
          AICR's upgrade check found changes that are not safe to apply as they
          are (the report is above and in {{ aicr_workdir }}/upgrade-check.txt).
          Follow its steps, then rerun with -e aicr_upgrade_check=report.
        quiet: true

- name: Keep the new bundle
  ansible.builtin.shell: |
    set -o pipefail
    rm -rf {{ aicr_bundle_dir | quote }}
    cp -a {{ (aicr_render_dir ~ '/bundle') | quote }} {{ aicr_bundle_dir | quote }}
  args:
    executable: /bin/bash
  when: aicr_bundle_diff.rc != 0
  changed_when: true

- name: Read the bundle's release list
  ansible.builtin.slurp:
    src: "{{ aicr_render_dir }}/bundle/bundle-info.yaml"
  register: aicr_bundle_info

- name: Remember which components the bundle installs
  ansible.builtin.set_fact:
    aicr_bundle_components: >-
      {{ (aicr_bundle_info.content | b64decode | from_yaml).layout.releases | map(attribute='component') | list }}
