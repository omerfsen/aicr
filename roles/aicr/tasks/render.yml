---
# The recipe and the bundle are rendered into an empty directory on every run
# (AICR renders the same inputs to the same bytes), and the new bundle replaces
# the kept one only when they differ.

- name: Work directory
  ansible.builtin.file:
    path: "{{ aicr_workdir }}"
    state: directory
    owner: "{{ aicr_owner }}"
    group: "{{ aicr_group }}"
    mode: "0700"

# Rendering changes nothing on the cluster, so it also runs in check mode.
- name: Empty the render directory
  ansible.builtin.file:
    path: "{{ aicr_render_dir }}"
    state: absent
  changed_when: false
  check_mode: false

- name: Render directory
  ansible.builtin.file:
    path: "{{ aicr_render_dir }}"
    state: directory
    owner: "{{ aicr_owner }}"
    group: "{{ aicr_group }}"
    mode: "0700"
  changed_when: false
  check_mode: false

- name: Write the AICRConfig
  ansible.builtin.template:
    src: aicr-config.yaml.j2
    dest: "{{ aicr_render_dir }}/aicr-config.yaml"
    owner: "{{ aicr_owner }}"
    group: "{{ aicr_group }}"
    mode: "0600"
  changed_when: false
  check_mode: false

- name: The external data flags
  ansible.builtin.set_fact:
    aicr_data_args: "{{ ['--data', aicr_render_dir ~ '/data'] if aicr_data_src | length > 0 else [] }}"

# Inside the render directory: what it changes shows up as a bundle difference.
- name: Copy the external data
  ansible.builtin.copy:
    src: "{{ aicr_data_src | regex_replace('/*$', '') }}/"
    dest: "{{ aicr_render_dir }}/data/"
    owner: "{{ aicr_owner }}"
    group: "{{ aicr_group }}"
    mode: "0600"
    directory_mode: "0700"
  changed_when: false
  check_mode: false
  when: aicr_data_src | length > 0

- name: Render the recipe
  ansible.builtin.command:
    argv: "{{ [aicr_bin_dir ~ '/aicr', 'recipe', '--config', aicr_render_dir ~ '/aicr-config.yaml'] + aicr_data_args }}"
  changed_when: false
  check_mode: false

# --set-json pairs: ['--set-json', 'component:path=<json>', ...].
- name: Render the bundle
  ansible.builtin.command:
    argv: >-
      {{ [aicr_bin_dir ~ '/aicr', 'bundle', '--config', aicr_render_dir ~ '/aicr-config.yaml']
         + aicr_data_args
         + (['--set-json'] | product(aicr_set_json | dict2items
              | map(attribute='key')
              | zip(aicr_set_json | dict2items | map(attribute='value') | map('to_json'))
              | map('join', '=')) | flatten(levels=1)) }}
  changed_when: false
  check_mode: false

- name: Compare the new bundle with the kept one
  ansible.builtin.command:
    argv: [diff, -r, -q, "{{ aicr_render_dir }}/bundle", "{{ aicr_bundle_dir }}"]
  register: aicr_bundle_diff
  # Check mode skips the swap below, so the difference is reported here.
  changed_when: ansible_check_mode and aicr_bundle_diff.rc != 0
  check_mode: false
  failed_when: aicr_bundle_diff.rc > 2

- name: Keep the new bundle
  ansible.builtin.shell: |
    set -o pipefail
    rm -rf {{ aicr_bundle_dir | quote }}
    cp -a {{ (aicr_render_dir ~ '/bundle') | quote }} {{ aicr_bundle_dir | quote }}
  args:
    executable: /bin/bash
  when: aicr_bundle_diff.rc != 0
  changed_when: true

- name: Read the bundle's release list
  ansible.builtin.slurp:
    src: "{{ aicr_render_dir }}/bundle/bundle-info.yaml"
  register: aicr_bundle_info

- name: Remember which components the bundle installs
  ansible.builtin.set_fact:
    aicr_bundle_components: >-
      {{ (aicr_bundle_info.content | b64decode | from_yaml).layout.releases | map(attribute='component') | list }}
